    strict_variables: '%kernel.debug%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false 

    Prezent\GridBundle\Tests\Fixtures\AppBundle\Controller\TestController:
        tags:
            - { name: controller.service_arguments }
